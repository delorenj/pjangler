name: CI

# Two jobs, both on standard GitHub-hosted runners (PJAN-163, PJAN-164):
#
#   ci       ubuntu-latest: tests, coverage, and the coverage ratchet. Never
#            publishes.
#   publish  ubuntu-latest, after a green ci: the version bump, npm publish
#            --provenance over OIDC, then the release commit and tag.
#
# This repository is public, so a standard GitHub-hosted runner costs nothing.
# The rule is no PAID runners, not no hosted ones. Every job here starts on a
# clean machine that has only what this file installs, so a suite passes on its
# own merits. Until PJAN-164 the ci job ran on a self-hosted runner, as the
# operator, in his real HOME, and the host quietly lent the suite what this file
# never installed: a newer mise ahead of the pinned one on PATH (PJAN-154), the
# Krebs tp adapters under ~/code/33GOD (PJAN-155) and bun. Two broken suites
# stayed green that way, and a third would have skipped itself on a clean
# runner. Anything a suite needs is set up below, in the open.
#
# The publish job has to be GitHub-hosted regardless: npm's OIDC trusted
# publishing and provenance work only on GitHub-hosted runners; npm's docs say
# "Self-hosted runners are not currently supported", and npm rejected both from
# a self-hosted runner with E422 (run 36927547374). Publishing over OIDC means
# there is no npm token in this workflow at all: the publish job's id-token is
# what proves to npm who is publishing, and the same id-token signs the SLSA
# provenance attestation.
#
# The FILENAME is load-bearing: npm's trusted publisher for @delorenj/pjangler
# names this workflow file, and the OIDC token is only honoured when it matches.
# Renaming this to ci.yml made `npm publish` fail with ENEEDAUTH (npm never
# even attempted OIDC) while every test passed. Rename it only after updating
# the trusted publisher on npmjs.com, or the pipeline goes green and ships
# nothing.
#
# One workflow file, two jobs. The publish job has to run after the tests pass
# (needs: ci) and has to receive the coverage floor the ci job measured (an
# artifact, below); both work only within one run. The environment setup in the
# ci job (a uv-managed Copier that passes pjangler's own attestation, PyYAML for
# the profile renderer) is what the TESTS need, so it lives there alone; the
# publish job only builds and packs, and needs none of it.
#
# Publishing is deliberately optimistic: green on main ships, immediately. The
# fleet running from main trunk should have the latest features; a bug reaching
# them is cheaper than every agent running weeks-old code. There is exactly one
# user, and he would rather find the bug than be protected from it.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  # Never let two main runs publish at once. Do not cancel in progress: a
  # half-finished publish is worse than a queued one.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    # Belt and braces against a publish loop. The release commit (publish job)
    # carries a skip marker, but that marker is matched anywhere in the commit
    # MESSAGE — body included — so any commit that merely writes about it skips
    # itself. That is not hypothetical: the commit introducing this file did
    # exactly that and never ran. This actor guard is the half that prose cannot
    # break, and the publish job needs this one, so it is skipped with it.
    if: github.actor != 'github-actions[bot]'
    # GitHub-hosted, and free because the repository is public. It only tests
    # and ratchets coverage: no bump, no publish, no commit. It has no use for
    # an OIDC token and never pushes, so it only reads the repository.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # pjan-80-consumer-concurrency and pjan-80-registry-regressions talk to a
    # real PostgreSQL — the registry service is Postgres-backed and there is no
    # fake worth trusting for concurrency behaviour. They default PGHOST to the
    # unix socket at /var/run/postgresql, which does not exist on a runner, so
    # without this they failed with `connect ENOENT` on every run. PGHOST below
    # sends them to the service container over TCP instead. (pg-registry
    # -regressions has its own skip path and was the only one passing.)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        # The standard port. A hosted runner is a fresh VM: the image ships a
        # PostgreSQL but never starts it, so nothing else holds 5432. (The
        # self-hosted runner had a native postgres there, which is why this was
        # a dynamic mapping read back into PGPORT, PJAN-152.)
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    # pg, psql and the registry service all read these from the environment.
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      # pg-registry-regressions skips itself, exit 0, when postgres, psql or
      # bun is missing. This job provides all three, so a missing one is a
      # broken job and must fail it rather than pass an untested suite
      # (release.sh sets the same for the local release gate).
      PJANGLER_REQUIRE_DISPOSABLE_POSTGRES: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Bridge canonical SSH submodule URLs to checkout HTTPS credentials
        run: |
          test -n "$(git config --local --get http.https://github.com/.extraheader)"
          git config --local url."https://github.com/".insteadOf "git@github.com:"
          test "$(git config --local --get url.https://github.com/.insteadof)" = "git@github.com:"

      - name: Fetch recursive submodule history and tags
        run: >-
          git submodule foreach --recursive
          'if test "$(git rev-parse --is-shallow-repository)" = true;
          then git fetch --unshallow --tags --force origin;
          else git fetch --tags --force origin; fi'

      - name: Verify CommonProject tag history
        run: |
          test -n "$(git -C templates/commonproject tag --list)"
          git -C templates/commonproject describe --tags --abbrev=0 HEAD

      # pjan-23 and pjan-50 test the Krebs tp adapters (plane.sh, linear.sh,
      # trello.sh): the copy provisionTicketProviderBoard resolves and runs.
      # Krebs owns them and pjangler never vendors them; they live in the public
      # 33GOD monorepo at krebs/adapters/tp. resolveTicketProviderAdapter tries
      # PJ_TICKET_PROVIDER_ADAPTERS, then krebs/adapters/tp up the tree from
      # pjangler, then ~/code/33GOD/krebs/adapters/tp, and on a clean runner
      # only the first can exist (PJAN-155). The adapters come from 33GOD's
      # main, as an operator's checkout does, so a Krebs change that breaks
      # pjangler's contract fails here rather than on the fleet.
      - name: Fetch the Krebs tp adapters
        run: |
          set -euo pipefail
          krebs="$RUNNER_TEMP/33GOD"
          git clone --quiet --depth 1 --filter=blob:none --sparse https://github.com/delorenj/33GOD.git "$krebs"
          git -C "$krebs" sparse-checkout set krebs/adapters/tp
          adapters="$krebs/krebs/adapters/tp"
          for provider in plane linear trello; do test -f "$adapters/$provider.sh"; done
          echo "Krebs tp adapters at 33GOD $(git -C "$krebs" rev-parse --short HEAD)"
          echo "PJ_TICKET_PROVIDER_ADAPTERS=$adapters" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # pg-registry-regressions runs its PgRegistryStore round-trip harness
      # (tests/_pg_store_check.ts) under bun. The self-hosted runner lent it the
      # host's bun; on a clean runner without one the suite skipped and still
      # counted as a pass, and the migrations it applies dropped out of the
      # coverage (PJAN-164).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.13'

      # The suites drive the real mise, and pjangler's mise rules are measured
      # on 2026.9.12 (src/parity/mise-toml.ts), so CI runs that version. On
      # 2026.7.5, the pin until PJAN-154, the pjan-135 hook suites cannot pass:
      # it predates the `script` hook deprecation (2026.7.8) they assert on, and
      # enter hooks never fire under their activate/hook-env sequence. Raise
      # this pin together with the version in tests/release-regressions.mjs.
      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: '2026.9.12'
          install: false
          cache: false
          env: false

      - name: Verify mise installation
        run: mise --version

      # pjangler only trusts a Copier installed as a uv tool: it attests the
      # wheel against its RECORD digests under ~/.local/share/uv/tools/copier
      # and refuses any other Copier earlier on PATH as untrusted. The one entry
      # it passes over, unexecuted, is an inactive mise shim: a symlink to mise
      # at ~/.local/share/mise/shims/copier in the OS account's home (PJAN-150;
      # contract in src/lifecycle/preflight.ts).
      # A pip install lands in the Python toolcache instead, so the lifecycle
      # tests could never exercise a trusted Copier here.
      # hermes-profile-config.py — the base+delta profile renderer pjangler
      # shells out to during Hermes provisioning — is the one script it invokes
      # with a third-party dependency. Without PyYAML it exits non-zero and
      # hermes.runtime-singleton blocks the whole lifecycle.
      #
      # uv supplies both itself and Python 3.12 (PJAN-153), because the trust
      # check below accepts only a uv-managed interpreter; a setup-python one
      # lives in the runner's toolcache and is refused. These steps sit after
      # mise on purpose: mise-action prepends its shims directory to PATH, and
      # a mise shim ahead of this interpreter answers `python` with "No version
      # is set" (it did on the old self-hosted runner). Anything added to PATH
      # later wins, so this has to come later.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.14'
      # The attestation also requires the tool's INTERPRETER to resolve inside
      # ~/.local/share/uv/python, so uv has to manage the Python too — a tool
      # installed against any other Python is rejected.
      - run: uv python install 3.12
      - name: Put uv's Python 3.12 on PATH
        run: |
          interpreter="$(uv python find --managed-python 3.12)"
          echo "python 3.12: $interpreter"
          dirname "$interpreter" >> "$GITHUB_PATH"
      # uv marks its managed Pythons EXTERNALLY-MANAGED (PEP 668), so a plain
      # pip install is refused. This interpreter exists to run pjangler's
      # scripts, and they import PyYAML from its own site-packages (some run
      # under `python3 -I`, which ignores --user installs).
      - run: python -m pip install --break-system-packages 'pyyaml==6.0.2'
      - run: uv tool install --python 3.12 'copier==9.14.0'
        env:
          UV_PYTHON_PREFERENCE: only-managed
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify Copier is trusted where pjangler looks for it
        run: |
          test -x "$HOME/.local/share/uv/tools/copier/bin/copier"
          interpreter="$(sed -n '1s/^#!//p' "$HOME/.local/share/uv/tools/copier/bin/copier")"
          echo "copier interpreter: $interpreter"
          readlink -f "$interpreter" | grep -q "^$HOME/.local/share/uv/python/" \
            || { echo "interpreter is not uv-managed; pjangler will refuse it" >&2; exit 1; }
          copier --version

      - run: npm ci
      - run: npm run typecheck
      # Build before the contract test, matching the order publish.yml used:
      # it exercises the built installer, not the sources.
      - run: npm run build
      - run: npm run test:bmad-installer-contract

      # test:coverage builds (with sourcemaps) and runs the whole suite under
      # c8. 37 of the suites spawn dist/index.js rather than importing src, so
      # the sourcemaps are what makes the numbers describe src/*.ts instead of
      # the bundle. A failing suite fails here, exactly as `npm test` would.
      - name: Test with coverage
        run: npm run test:coverage

      # On a PR the ratchet only reports. On main it raises the floor, and the
      # raise rides along in the publish job's release commit (handed over
      # below).
      - name: Coverage ratchet
        run: ${{ github.ref == 'refs/heads/main' && 'npm run coverage:apply' || 'npm run coverage:check' }}

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          retention-days: 14
          if-no-files-found: warn

      # The publish job's release commit stages .coverage-floor.json, and on
      # main the ratchet above has just raised it. Jobs share no workspace: the
      # publish job checks out the pushed commit, whose floor is the old one, so
      # the measured floor travels as an artifact or the raise is lost.
      # include-hidden-files because upload-artifact skips dot-files by default,
      # and this is one. overwrite lets a re-run of this job replace it.
      - name: Hand the coverage floor to the publish job
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-floor
          path: .coverage-floor.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  publish:
    # GitHub-hosted, because npm's OIDC trusted publishing and provenance work
    # only on GitHub-hosted runners, and free, because this repository is
    # public. It is also the only job with an id-token
    # (tests/release-regressions.mjs pins both).
    needs: ci
    # The gate the release steps had when they lived in the ci job: green main
    # pushes and v* tags, never the bot's own release push. `needs` already
    # skips this when ci was skipped or failed; the actor guard is repeated so
    # that stays true if ci's gate ever changes.
    if: github.actor != 'github-actions[bot]' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # OIDC trusted publishing to npm, and the provenance attestation
      contents: write # the release commit + tag on main
    steps:
      # Full history and tags: the bump reads which v* tags are taken, and the
      # release commit is pushed on top of this checkout. The persisted
      # GITHUB_TOKEN credential is what that push uses.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      # prepublishOnly runs check:submodules --remote --recursive --archive
      # --npm, then build, then check:tracked-secrets. --remote resolves each
      # submodule's canonical SSH URL, so it needs the same HTTPS bridge and the
      # same submodule history as the ci job has.
      - name: Bridge canonical SSH submodule URLs to checkout HTTPS credentials
        run: |
          test -n "$(git config --local --get http.https://github.com/.extraheader)"
          git config --local url."https://github.com/".insteadOf "git@github.com:"
          test "$(git config --local --get url.https://github.com/.insteadof)" = "git@github.com:"

      - name: Fetch recursive submodule history and tags
        run: >-
          git submodule foreach --recursive
          'if test "$(git rev-parse --is-shallow-repository)" = true;
          then git fetch --unshallow --tags --force origin;
          else git fetch --tags --force origin; fi'

      # registry-url writes the .npmrc npm publishes through.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer. Upgrade only when the
      # runner's Node ships an older one, then prove the result.
      - name: Use an npm that supports trusted publishing
        run: |
          set -euo pipefail
          need=11.5.1
          older() { [ "$(printf '%s\n%s\n' "$1" "$need" | sort -V | head -1)" != "$need" ]; }
          if older "$(npm --version)"; then npm install -g "npm@^$need"; fi
          npm --version
          if older "$(npm --version)"; then echo "npm $(npm --version) is older than $need" >&2; exit 1; fi

      - run: npm ci

      # The floor the ci job measured and raised (see 'Hand the coverage floor
      # to the publish job'), copied over the checkout's so the release commit
      # carries the raise. Downloaded outside the workspace and copied by name,
      # so nothing else can land in the release tree.
      - name: Download the coverage floor the ci job measured
        if: github.ref == 'refs/heads/main'
        uses: actions/download-artifact@v4
        with:
          name: coverage-floor
          path: ${{ runner.temp }}/coverage-floor

      - name: Put the measured coverage floor in the release tree
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/coverage-floor/.coverage-floor.json" .coverage-floor.json
          git diff --stat -- .coverage-floor.json

      # Publishing on every main push needs a version nobody has used. Bump from
      # what is actually taken, not from package.json alone, so a hand-edited or
      # reverted version cannot collide. Taken means npm has it OR a git tag
      # v<version> exists, locally or on origin (PJAN-160: a hand-cut v1.5.0 tag
      # with 1.5.0 never on npm failed every release at `git tag`). The decision
      # lives in scripts/release-version.mjs so it can be tested offline; it
      # fetches tags itself and reads origin's directly. The bump is left in the
      # working tree (package.json, package-lock.json) for the publish to read.
      - name: Bump version from the published one
        if: github.ref == 'refs/heads/main'
        id: bump
        run: node scripts/release-version.mjs

      # Publish BEFORE the release commit and tag. A tag names a version npm
      # has; it is never a promise. When the commit and tag went first, every
      # failed publish still left a release commit and a v<version> tag on
      # origin for a version npm never received, and since a tag reserves its
      # version, the next run skipped it: one burned patch number per green
      # push for as long as publishing stayed broken (v1.5.1, run 36924931617).
      # prepublishOnly only reads the tree (lock parity, submodule contract,
      # build into the ignored dist/, secret scan), so the uncommitted bump is
      # what it checks and what ships.
      #
      # OIDC trusted publishing, with provenance (PJAN-163). npm exchanges this
      # job's id-token for a short-lived publish credential, and --provenance
      # signs a SLSA attestation from the same id-token, linking the tarball to
      # this workflow run. There is no npm token: NODE_AUTH_TOKEN is set empty,
      # as it was before PJAN-161 (1.4.6 shipped this way, with provenance),
      # because setup-node's .npmrc reads it and setup-node exports a
      # placeholder when it is unset. Never put a token back here: if OIDC
      # broke, a token would quietly take over and ship without provenance.
      - name: Publish to npm
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        id: publish
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ""

      # Only a version npm accepted gets a release commit and a tag. The gate
      # names the publish outcome, not just the implicit success(), so making
      # the publish continue-on-error can never let a failed one through. The
      # coverage-floor raise rides along here too: a failed publish defers it,
      # and the next green run measures and raises it again. A push that loses
      # to a moved main fails this step, exactly as it did before the reorder;
      # npm already has the version by then, so the next run bumps past it
      # rather than reusing the name. The push is atomic (PJAN-161): main and
      # the tag land together or neither does. --follow-tags pushed each ref on
      # its own, so a rejected main still landed the tag, on a commit main never
      # got.
      - name: Commit the release
        if: github.ref == 'refs/heads/main' && steps.publish.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .coverage-floor.json
          # [skip ci] keeps this push from retriggering the workflow.
          git commit -m "chore(release): v${{ steps.bump.outputs.next }} [skip ci]" || {
            echo "nothing to commit"; exit 0; }
          # Annotated. The push used to be --follow-tags, which pushes only
          # annotated tags: the lightweight v1.4.3-v1.4.6 created here never
          # reached origin, so the next run could not see them as taken. The
          # push names the tag explicitly now, and it stays annotated so a
          # release tag carries its tagger and date and `git describe` sees it.
          git tag -a "v${{ steps.bump.outputs.next }}" -m "v${{ steps.bump.outputs.next }}"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v${{ steps.bump.outputs.next }}"
