name: CI

# The FILENAME was load-bearing while this published over OIDC: npm's trusted
# publisher for @delorenj/pjangler names this workflow file, and renaming it to
# ci.yml made `npm publish` fail with ENEEDAUTH while every test passed. It now
# publishes with a token (PJAN-161, see 'Publish to npm'), so the name no longer
# gates publishing, but the trusted publisher on npmjs.com still names it. Keep
# the name, so OIDC works again the day it moves to a runner that supports it.
#
# One workflow, not two. The environment setup below (a uv-managed Copier that
# passes pjangler's own attestation, PyYAML for the profile renderer) is what
# the TESTS need, not just the publish. Splitting it across two files would
# mean two copies of that setup, and they would drift.
#
# Publishing is deliberately optimistic: green on main ships, immediately. The
# fleet running from main trunk should have the latest features; a bug reaching
# them is cheaper than every agent running weeks-old code. There is exactly one
# user, and he would rather find the bug than be protected from it.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  # Never let two main runs publish at once. Do not cancel in progress: a
  # half-finished publish is worse than a queued one.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    # Belt and braces against a publish loop. The release commit below carries a
    # skip marker, but that marker is matched anywhere in the commit MESSAGE —
    # body included — so any commit that merely writes about it skips itself.
    # That is not hypothetical: the commit introducing this file did exactly
    # that and never ran. This actor guard is the half that prose cannot break.
    if: github.actor != 'github-actions[bot]'
    runs-on: [self-hosted, Linux, delonet]
    environment: release
    # No id-token: npm's OIDC trusted publishing and provenance only work on
    # GitHub-hosted runners, so this self-hosted one publishes with a token and
    # has no use for an OIDC token (PJAN-161).
    permissions:
      contents: write # the release commit + tag on main
    # pjan-80-consumer-concurrency and pjan-80-registry-regressions talk to a
    # real PostgreSQL — the registry service is Postgres-backed and there is no
    # fake worth trusting for concurrency behaviour. They default PGHOST to the
    # unix socket at /var/run/postgresql, which does not exist on a runner, so
    # without this they failed with `connect ENOENT` on every run. PGHOST below
    # sends them to the service container over TCP instead. (pg-registry
    # -regressions has its own skip path and was the only one passing.)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        # Container port only: Docker picks a free host port. The self-hosted
        # runner's host already has a native postgres on 0.0.0.0:5432, so a
        # fixed 5432:5432 fails 'Initialize containers' with `address already
        # in use` (PJAN-152). The step below exports the mapped port as PGPORT.
        ports:
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
    steps:
      # The `job` context is not available in jobs.<id>.env, so the service's
      # mapped host port is exported here for every later step. pg, psql and
      # the registry service all read PGPORT from the environment.
      - name: Point PG clients at the postgres service's mapped port
        run: |
          port="${{ job.services.postgres.ports['5432'] }}"
          test -n "$port"
          echo "PGPORT=$port" >> "$GITHUB_ENV"
          echo "postgres service mapped to localhost:$port"

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Bridge canonical SSH submodule URLs to checkout HTTPS credentials
        run: |
          test -n "$(git config --local --get http.https://github.com/.extraheader)"
          git config --local url."https://github.com/".insteadOf "git@github.com:"
          test "$(git config --local --get url.https://github.com/.insteadof)" = "git@github.com:"

      - name: Fetch recursive submodule history and tags
        run: >-
          git submodule foreach --recursive
          'if test "$(git rev-parse --is-shallow-repository)" = true;
          then git fetch --unshallow --tags --force origin;
          else git fetch --tags --force origin; fi'

      - name: Verify CommonProject tag history
        run: |
          test -n "$(git -C templates/commonproject tag --list)"
          git -C templates/commonproject describe --tags --abbrev=0 HEAD

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: '2026.7.5'
          install: false
          cache: false
          env: false

      - name: Verify mise installation
        run: mise --version

      # pjangler only trusts a Copier installed as a uv tool: it attests the
      # wheel against its RECORD digests under ~/.local/share/uv/tools/copier
      # and refuses any other Copier earlier on PATH as untrusted. The one entry
      # it passes over, unexecuted, is an inactive mise shim: a symlink to mise
      # at ~/.local/share/mise/shims/copier in the OS account's home (PJAN-150;
      # contract in src/lifecycle/preflight.ts).
      # A pip install lands in the Python toolcache instead, so the lifecycle
      # tests could never exercise a trusted Copier here.
      # hermes-profile-config.py — the base+delta profile renderer pjangler
      # shells out to during Hermes provisioning — is the one script it invokes
      # with a third-party dependency. Without PyYAML it exits non-zero and
      # hermes.runtime-singleton blocks the whole lifecycle.
      #
      # uv supplies both itself and Python 3.12 (PJAN-153): actions/setup-python
      # ships no 3.12 build for the self-hosted runner's Ubuntu 25.10. These
      # steps sit after mise on purpose. mise-action prepends the host's mise
      # shims to PATH, and a shim ahead of this interpreter answers `python`
      # with "No version is set" and `python3` with the system 3.13, which has
      # no PyYAML. Anything added to PATH later wins, so this has to come later.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.14'
      # The attestation also requires the tool's INTERPRETER to resolve inside
      # ~/.local/share/uv/python, so uv has to manage the Python too — a tool
      # installed against any other Python is rejected.
      - run: uv python install 3.12
      - name: Put uv's Python 3.12 on PATH
        run: |
          interpreter="$(uv python find --managed-python 3.12)"
          echo "python 3.12: $interpreter"
          dirname "$interpreter" >> "$GITHUB_PATH"
      # uv marks its managed Pythons EXTERNALLY-MANAGED (PEP 668), so a plain
      # pip install is refused. This interpreter exists to run pjangler's
      # scripts, and they import PyYAML from its own site-packages (some run
      # under `python3 -I`, which ignores --user installs).
      - run: python -m pip install --break-system-packages 'pyyaml==6.0.2'
      - run: uv tool install --python 3.12 'copier==9.14.0'
        env:
          UV_PYTHON_PREFERENCE: only-managed
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify Copier is trusted where pjangler looks for it
        run: |
          test -x "$HOME/.local/share/uv/tools/copier/bin/copier"
          interpreter="$(sed -n '1s/^#!//p' "$HOME/.local/share/uv/tools/copier/bin/copier")"
          echo "copier interpreter: $interpreter"
          readlink -f "$interpreter" | grep -q "^$HOME/.local/share/uv/python/" \
            || { echo "interpreter is not uv-managed; pjangler will refuse it" >&2; exit 1; }
          copier --version

      - run: npm ci
      - run: npm run typecheck
      # Build before the contract test, matching the order publish.yml used:
      # it exercises the built installer, not the sources.
      - run: npm run build
      - run: npm run test:bmad-installer-contract

      # test:coverage builds (with sourcemaps) and runs the whole suite under
      # c8. 37 of the suites spawn dist/index.js rather than importing src, so
      # the sourcemaps are what makes the numbers describe src/*.ts instead of
      # the bundle. A failing suite fails here, exactly as `npm test` would.
      - name: Test with coverage
        run: npm run test:coverage

      # On a PR the ratchet only reports. On main it raises the floor, and the
      # raise rides along in the release commit below.
      - name: Coverage ratchet
        run: ${{ github.ref == 'refs/heads/main' && 'npm run coverage:apply' || 'npm run coverage:check' }}

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          retention-days: 14
          if-no-files-found: warn

      # ---- everything below only runs for a green main ----

      # Publishing on every main push needs a version nobody has used. Bump from
      # what is actually taken, not from package.json alone, so a hand-edited or
      # reverted version cannot collide. Taken means npm has it OR a git tag
      # v<version> exists, locally or on origin (PJAN-160: a hand-cut v1.5.0 tag
      # with 1.5.0 never on npm failed every release at `git tag`). The decision
      # lives in scripts/release-version.mjs so it can be tested offline; it
      # fetches tags itself and reads origin's directly. The bump is left in the
      # working tree (package.json, package-lock.json) for the publish to read.
      - name: Bump version from the published one
        if: github.ref == 'refs/heads/main'
        id: bump
        run: node scripts/release-version.mjs

      # Publish BEFORE the release commit and tag. A tag names a version npm
      # has; it is never a promise. When the commit and tag went first, every
      # failed publish still left a release commit and a v<version> tag on
      # origin for a version npm never received, and since a tag reserves its
      # version, the next run skipped it: one burned patch number per green
      # push for as long as publishing stayed broken (v1.5.1, run 36924931617).
      # prepublishOnly only reads the tree (lock parity, submodule contract,
      # build into the ignored dist/, secret scan), so the uncommitted bump is
      # what it checks and what ships.
      #
      # A token, not OIDC, and no --provenance (PJAN-161). npm supports trusted
      # publishing and provenance only on GitHub-hosted runners, and rejected
      # both from this self-hosted one with E422 (run 36927547374); hosted
      # minutes are not an option here. Publishing with a token is the
      # operator's choice. NPM_TOKEN is a repo secret holding a granular npm
      # token with write on @delorenj/pjangler only, bypass-2FA, expiring
      # 2026-12-30; the same token is 1Password DeLoSecrets item
      # xdpa2j73r2lpe7bey4adjutghq. Rotating it is not the whole story: npm
      # plans to remove direct publishing from bypass-2FA tokens around January
      # 2027, so this step needs a new answer before then.
      # setup-node's registry-url writes the .npmrc that reads NODE_AUTH_TOKEN.
      # The token is set on this step alone so no other step's env carries it.
      - name: Publish to npm
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        id: publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Only a version npm accepted gets a release commit and a tag. The gate
      # names the publish outcome, not just the implicit success(), so making
      # the publish continue-on-error can never let a failed one through. The
      # coverage-floor raise rides along here too: a failed publish defers it,
      # and the next green run measures and raises it again. A push that loses
      # to a moved main fails this step, exactly as it did before the reorder;
      # npm already has the version by then, so the next run bumps past it
      # rather than reusing the name. The push is atomic (PJAN-161): main and
      # the tag land together or neither does. --follow-tags pushed each ref on
      # its own, so a rejected main still landed the tag, on a commit main never
      # got.
      - name: Commit the release
        if: github.ref == 'refs/heads/main' && steps.publish.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .coverage-floor.json
          # [skip ci] keeps this push from retriggering the workflow.
          git commit -m "chore(release): v${{ steps.bump.outputs.next }} [skip ci]" || {
            echo "nothing to commit"; exit 0; }
          # Annotated. The push used to be --follow-tags, which pushes only
          # annotated tags: the lightweight v1.4.3-v1.4.6 created here never
          # reached origin, so the next run could not see them as taken. The
          # push names the tag explicitly now, and it stays annotated so a
          # release tag carries its tagger and date and `git describe` sees it.
          git tag -a "v${{ steps.bump.outputs.next }}" -m "v${{ steps.bump.outputs.next }}"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v${{ steps.bump.outputs.next }}"
