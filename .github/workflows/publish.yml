name: Publish to npmjs.com

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install 'copier==9.14.0'
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:bmad-installer-contract
      - run: npm test

      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ""
