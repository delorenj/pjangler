# Hermes agent role manifest.  Tracked in the PROJECT repository.
# The agent's actual state (memory, sessions, evolving SOUL) lives in the
# ignored local runtime. This file is the immutable contract for this role.

repo: pjangler
role: pm
agent_id: pjangler-pm
display_name: "Pjangler PM"
purpose: "pm agent for pjangler"

# Inference target (empty = inherit from global ~/.hermes/config.yaml)
model:
  provider: ""
  name: ""
# Hermes profile name. Profile dir is symlinked into ./runtime/.
profile: pjangler-pm

# Telegram bot identity (one bot per agent — see docs/architecture.md).
telegram:
  bot_username: "pjangler_pm_bot"

# Ticket-provider adapter preference (plane | trello).
# Repo-owned board identity lives in repo-root .project.json, not in this role.
ticket_provider:
  name: plane
  timezone: "America/New_York"
  # This board has TWO states in Plane's `unstarted` group -- "Todo" and
  # "Ready for Implementation" -- so the adapter refuses to guess and every
  # `transition <id> unstarted` fails until one is named here. A story that has
  # a ticket but no spec yet belongs in Todo; "Ready for Implementation" means
  # planning is already done. Named after PJAN-111 and PJAN-112 were swept into
  # a completed state by a bulk transition and could not be walked back.
  unstarted: "Todo"

# Scrum Master sentinel knobs (only meaningful for role: scrum-master).
scrum_master:
  grace_hours: 0             # 0 = no human-approval wait (adversarially-reviewed review-lane = done); set >0 to require a wait
  auto_review: true          # autonomous adversarial review (act, do not wait) on/off
  paired_pm: "pjangler-pm"

# Bloodbank wiring (consumed + produced subjects).
bloodbank:
  subscribe:
    # Non-functional: the repo name sits in the grammar's entity slot, which
    # real repo events fill with task/board/decision/intake/maintenance. Left
    # as-is pending the optional scope-tail phase; do not improvise a scope.
    - "bloodbank.evt.repo.pjangler.>"
    - "bloodbank.cmd.agent.pjangler-pm.>"
  producer: "hermes-agent:pjangler-pm"

# Pure-local HERMES_HOME. Legacy GitHub identity is metadata-only.
runtime:
  # Empty owner -> resolved from config.toml [github].runtime_repo_owner.
  github_owner: ""
  github_repo: "agent-hm-pjangler-pm"
  local_path: "./runtime"
  checkpoint:
    cadence: "disabled"
    on_session_end: false

# Provenance — managed by the template, do not hand-edit.
provisioned_at: "2026-06-04T17:38:16Z"
provisioned_by: hermes-agent-template
